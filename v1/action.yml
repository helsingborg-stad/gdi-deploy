name: GDI Deploy 1.0
description: Set version, build and push docker image to github registry for a gdi service.

inputs:
  update-openapi-version:
    description: If the version of an OpenAPI specification should be updated
    required: false
    type: boolean
  openapi-spec-file:
    description: Path to the openapi yml specification file to update, relative to the root of the repository.
    required: false
    type: string
  update-package-version:
    description: If the version of package.json should be updated.
    required: false
    type: boolean
  release-tag-name:
    description: The tag that was just released
    required: true
    type: string
  
  gdi-gitops-config-repo:
    description: The repository to update configs in for a deploy
    required: true
    type: string
  github-token:
    description: GitHub Token  
    required: true
    type: string
  gdi-gitops-token:
    description: GDI GitOps Token
    required: true
    type: string
  gdi-gitops-app:
    description: The GDI app to update
    required: true
    type: string
  gdi-gitops-env:
    description: The GDI apps environment to deploy to
    required: true
    type: string

  docker-username:
    description: Username to use when logging in to the docker registry
    required: true
    type: string
  
  docker-password:
    description: Password to use when logging in to the docker registry
    required: true
    type: string

  docker-no-cache:
    description: If we should not use cache when building.
    required: false
    default: false
    type: boolean

  extra-build-args:
    description: 'Extra build arguments to pass to Docker'
    required: false
    default: ''

  extra-image-tags:
    description: 'Extra tags to put on the docker image'
    required: false
    default: ''

  git-checkout-branch:
    description: The branch to checkout for building
    required: false
    default: main

runs:
  using: composite
  steps:
      -
        name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.git-checkout-branch }}

      -
        name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      -
        name: Set openapi version
        if: inputs.update-openapi-version == 'true'
        shell: bash
        env:
          OPENAPI_SPEC_FILE: ${{ inputs.openapi-spec-file }}
          RELEASE_TAG_NAME: ${{ inputs.release-tag-name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const file = process.env.OPENAPI_SPEC_FILE;
          const version = JSON.stringify(process.env.RELEASE_TAG_NAME);
          const source = fs.readFileSync(file, 'utf8');
          const newline = source.includes('\r\n') ? '\r\n' : '\n';
          const lines = source.split(/\r?\n/);
          const infoIndex = lines.findIndex((line) => /^info:\s*(?:#.*)?$/.test(line));

          if (infoIndex === -1) {
            throw new Error(`Could not find top-level info mapping in ${file}`);
          }

          const infoLines = [];
          let infoEnd = lines.length;
          for (let index = infoIndex + 1; index < lines.length; index += 1) {
            const line = lines[index];
            if (/^\S/.test(line) && !/^#/.test(line)) {
              infoEnd = index;
              break;
            }
            if (/\S/.test(line) && !/^\s*#/.test(line)) infoLines.push(line);
          }
          const directIndent = Math.min(
            ...infoLines.map((line) => line.match(/^\s*/)[0].length),
          );

          let updated = false;
          for (let index = infoIndex + 1; index < infoEnd; index += 1) {
            const line = lines[index];
            const match = line.match(/^(\s+version\s*:\s*).*$/);
            if (match && match[1].match(/^\s*/)[0].length === directIndent) {
              lines[index] = `${match[1]}${version}`;
              updated = true;
              break;
            }
          }

          if (!updated) {
            throw new Error(`Could not find info.version in ${file}`);
          }

          fs.writeFileSync(file, lines.join(newline));
          NODE

      - 
        name: Set package.json version
        if: inputs.update-package-version == 'true'
        shell: bash
        env:
          RELEASE_TAG_NAME: ${{ inputs.release-tag-name }}
        run: npm version --allow-same-version --no-git-tag-version "$RELEASE_TAG_NAME"

      - 
        name: Commit and push
        if: inputs.update-openapi-version == 'true' || inputs.update-package-version == 'true'
        shell: bash
        env:
          GIT_CHECKOUT_BRANCH: ${{ inputs.git-checkout-branch }}
          RELEASE_TAG_NAME: ${{ inputs.release-tag-name }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add --all
          git diff --cached --quiet || git commit -m "🔖 Set versions to release tag ${RELEASE_TAG_NAME}"
          git push --force-with-lease origin "HEAD:refs/heads/${GIT_CHECKOUT_BRANCH}"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.git-checkout-branch }}

      - name: Repository Variable to Lowercase
        id: string
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "lowercase=${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ inputs.docker-username }}
          password: ${{ inputs.docker-password }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          github-token: ${{ inputs.github-token }}
          images: ghcr.io/${{ steps.string.outputs.lowercase }}
          tags: |
            # set latest tag for default branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=sha
            type=sha,format=long
            ${{ inputs.extra-image-tags }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: ${{ inputs.docker-no-cache }}
          build-args: |
            GITHUB_ACCESS_TOKEN=${{ inputs.github-token }}
            ${{ inputs.extra-build-args }}

      - name: Trigger config repo update
        shell: bash
        env:
          GDI_GITOPS_APP: ${{ inputs.gdi-gitops-app }}
          GDI_GITOPS_CONFIG_REPO: ${{ inputs.gdi-gitops-config-repo }}
          GDI_GITOPS_ENV: ${{ inputs.gdi-gitops-env }}
          GDI_GITOPS_TOKEN: ${{ inputs.gdi-gitops-token }}
          RELEASE_TAG_NAME: ${{ inputs.release-tag-name }}
        run: |
          node --input-type=module <<'NODE'
          const repository = process.env.GDI_GITOPS_CONFIG_REPO;
          if (!/^[A-Za-z0-9_.-]+$/.test(repository)) {
            throw new Error('gdi-gitops-config-repo must be a repository name');
          }

          const response = await fetch(
            `${process.env.GITHUB_API_URL}/repos/helsingborg-stad/${repository}/actions/workflows/update-config.yml/dispatches`,
            {
              method: 'POST',
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: ['Bearer', process.env.GDI_GITOPS_TOKEN].join(' '),
                'X-GitHub-Api-Version': '2022-11-28',
              },
              body: JSON.stringify({
                ref: 'main',
                inputs: {
                  semver: process.env.RELEASE_TAG_NAME,
                  app: process.env.GDI_GITOPS_APP,
                  environment: process.env.GDI_GITOPS_ENV,
                },
              }),
            },
          );

          if (!response.ok) {
            throw new Error(`Workflow dispatch failed with HTTP ${response.status}`);
          }
          NODE
